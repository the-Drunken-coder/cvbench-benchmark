schema_version: cvbench.system/v1
id: cvbench-lite-mot
revision: yolox-nano-byte-association-v1

runtime:
  type: docker
  image: cvbench-example-lite-mot:v1
  command: ["python", "-m", "cvbench.examples.lite_mot"]

readiness:
  type: stdout_pattern
  pattern: CVBENCH_READY
  timeout_seconds: 30

shutdown:
  grace_period_seconds: 5

resources:
  cpu_limit: 4
  memory_limit_mb: 8192
  network_access: false
