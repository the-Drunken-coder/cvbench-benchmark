schema_version: cvbench.system/v1
id: cvbench-yolox-x-v3-experiment
revision: yolox-x-640-motion-masked-optical-flow-v1

runtime:
  type: docker
  image: cvbench-example-yolox-x:v3-test
  command: ["python", "-m", "cvbench.examples.advanced_mot"]

readiness:
  type: stdout_pattern
  pattern: CVBENCH_READY
  timeout_seconds: 30

shutdown:
  grace_period_seconds: 5

resources:
  cpu_limit: 4
  memory_limit_mb: 8192
  network_access: false
